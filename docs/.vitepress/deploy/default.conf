server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    gzip on;
    gzip_vary      on;
    gzip_disable "msie6";
    gzip_proxied any;
    gzip_min_length 1k;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml image/x-icon application/javascript;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    #认证后端
    location /api/ {
        proxy_set_header Host $host;
        # 客户端的真实ip地址
        proxy_set_header X-Forwarded-For $remote_addr;
        # 使用的协议
        proxy_set_header X-Forwarded-Proto $scheme;
        # 表示原始客户端请求的主机名，通常与 Host 头部相同。
        proxy_set_header X-Forwarded-Host $host;
        # 转发端口
        proxy_set_header X-Forwarded-Port $server_port;
        # 真实客户端访问端口
        proxy_set_header X-Real-Port $remote_port;
        proxy_pass ${API_PROXY_PASS};
    }

}